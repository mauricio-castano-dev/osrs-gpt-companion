[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osrs-gpt-companion"
version = "0.8.0"
description = "Local OSRS agent with Character Snapshot, SQLite memory and an OSRS-style interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3,<3",
    "PyJWT[crypto]>=2.10.1,<3",
    "pywin32>=308; sys_platform == 'win32'",
    "filelock>=3.16,<4",
    "watchdog>=6,<8",
    "pywebview>=5.3,<7; sys_platform == 'win32'",
]

[project.scripts]
osrs-companion = "main:main"
osrs-companion-ui = "main:run_ui"

[tool.setuptools]
py-modules = ["auth", "main", "inference", "state_monitor", "memory_db", "wiki_client", "tools", "osrs_reader", "web_app", "launcher"]
packages = ["ui", "frontend"]

[tool.setuptools.package-data]
ui = ["*.html", "*.css", "*.js"]
frontend = ["dist/*.html", "dist/assets/*.js", "dist/assets/*.css", "dist/assets/*.svg"]
